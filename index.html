<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, query, where, getDocs, deleteDoc, onSnapshot, arrayUnion, arrayRemove, increment, GeoPoint } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCPBrZMo6IYCwCDYV3HEfNcUmLUITR6VRc",
    authDomain: "elahbes.firebaseapp.com",
    projectId: "elahbes",
    storageBucket: "elahbes.firebasestorage.app",
    messagingSenderId: "800207969145",
    appId: "1:800207969145:web:aa19b725d1c92dd48fada8"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;
  let currentUserData = null;
  let followers = {};
  let stories = [];
  let allUsers = [];
  let activeUids = [];
  let searchTerm = '';
  let globalPresenceUnsubscribe = null;
  let selectedStoryType = 'text';

  // خريطة أكواد الدول حسب القارات والمناطق
  const countryCodeMap = {
    // الشرق الأوسط
    'SA': '🇸🇦', 'AE': '🇦🇪', 'QA': '🇶🇦', 'KW': '🇰🇼', 'BH': '🇧🇭', 'OM': '🇴🇲',
    'IQ': '🇮🇶', 'SY': '🇸🇾', 'JO': '🇯🇴', 'LB': '🇱🇧', 'PS': '🇵🇸', 'YE': '🇾🇪',
    'EG': '🇪🇬', 'SD': '🇸🇩', 'LY': '🇱🇾', 'TN': '🇹🇳', 'DZ': '🇩🇿', 'MA': '🇲🇦',
    
    // أوروبا
    'GB': '🇬🇧', 'FR': '🇫🇷', 'DE': '🇩🇪', 'IT': '🇮🇹', 'ES': '🇪🇸', 'PT': '🇵🇹',
    'NL': '🇳🇱', 'BE': '🇧🇪', 'SE': '🇸🇪', 'NO': '🇳🇴', 'DK': '🇩🇰', 'FI': '🇫🇮',
    
    // أمريكا الشمالية
    'US': '🇺🇸', 'CA': '🇨🇦', 'MX': '🇲🇽',
    
    // أمريكا الجنوبية
    'BR': '🇧🇷', 'AR': '🇦🇷', 'CO': '🇨🇴', 'CL': '🇨🇱',
    
    // آسيا
    'TR': '🇹🇷', 'IR': '🇮🇷', 'PK': '🇵🇰', 'IN': '🇮🇳', 'BD': '🇧🇩',
    'CN': '🇨🇳', 'JP': '🇯🇵', 'KR': '🇰🇷', 'ID': '🇮🇩', 'MY': '🇲🇾',
    
    // أفريقيا
    'NG': '🇳🇬', 'ZA': '🇿🇦', 'KE': '🇰🇪', 'ET': '🇪🇹',
    
    // أستراليا
    'AU': '🇦🇺', 'NZ': '🇳🇿'
  };

  function getFlagEmoji(countryCode) {
    if (!countryCode || countryCode.length !== 2) return '';
    return countryCodeMap[countryCode.toUpperCase()] || 
           String.fromCodePoint(...countryCode.toUpperCase().split('').map(c => 0x1F1E6 + c.charCodeAt(0) - 65));
  }

  // دالة استخراج كود الدولة من الإحداثيات باستخدام Reverse Geocoding - نسخة محسنة
  async function getCountryFromCoords(lat, lng) {
    try {
      // محاولة أولى مع Nominatim
      const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=3&accept-language=en`, {
        headers: {
          'User-Agent': 'MyApp/1.0'
        }
      });
      
      if (response.ok) {
        const data = await response.json();
        const countryCode = data.address?.country_code?.toUpperCase();
        if (countryCode && countryCode.length === 2) {
          return countryCode;
        }
      }
      
      // محاولة ثانية مع API آخر
      const response2 = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lng}&localityLanguage=en`);
      const data2 = await response2.json();
      return data2.countryCode?.toUpperCase() || '';
      
    } catch (error) {
      console.error('Error getting country:', error);
      
      // محاولة احتياطية مع API آخر
      try {
        const response3 = await fetch(`https://geocode.xyz/${lat},${lng}?geoit=json`);
        const data3 = await response3.json();
        return data3.country?.toUpperCase() || '';
      } catch (e2) {
        console.error('Backup API failed:', e2);
        return '';
      }
    }
  }

  // دالة لتحديث أكواد الدول للمستخدمين الذين ليس لديهم
  async function updateMissingCountryCodes() {
    const usersWithoutCountry = allUsers.filter(u => !u.countryCode && u.location);
    
    for (const user of usersWithoutCountry) {
      try {
        const countryCode = await getCountryFromCoords(
          user.location.latitude, 
          user.location.longitude
        );
        
        if (countryCode) {
          user.countryCode = countryCode;
          await updateDoc(doc(db, "users", user.id), { 
            countryCode: countryCode 
          });
          console.log(`✅ تم تحديث كود الدولة لـ ${user.username}: ${countryCode}`);
        }
      } catch (e) {
        console.error(`فشل تحديث ${user.username}:`, e);
      }
    }
    
    if (usersWithoutCountry.length > 0) {
      renderMembersList();
    }
  }

  function showToast(msg, isSuccess = true) {
    const t = document.getElementById('toastMsg');
    t.textContent = msg;
    t.style.background = isSuccess ? '#10b981' : '#ef4444';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
  }

  window.closeModal = (id) => document.getElementById(id)?.classList.remove('active');
  window.openModal = (id) => document.getElementById(id)?.classList.add('active');

  function renderAvatar(user) {
    if (!user) return '👤';
    if (user.avatarType === 'image' && user.avatarUrl) {
      return `<img src="${user.avatarUrl}" style="width:100%;height:100%;object-fit:cover;" onerror="this.parentElement.innerHTML='👤'">`;
    }
    return user.emoji || user.avatarEmoji || '😎';
  }

  function getIdClass(userId) {
    if (!userId) return '';
    const digits = String(userId).replace(/\D/g, '').length;
    if (digits === 1) return 'id-1-digit';
    if (digits === 2) return 'id-2-digit';
    if (digits === 3) return 'id-3-digit';
    return '';
  }

  function isFollowing(userId) {
    return followers[currentUser?.uid]?.includes(userId) || false;
  }

  function isUserActive(uid) {
    return activeUids.includes(uid);
  }

  function hasFrame(user) {

  // دالة لمراقبة تغييرات الغرفة فورياً
  function watchUserRoomRealtime(uid, callback) {
    if (!uid) {
      callback({ roomName: null, roomId: null, isInRoom: false });
      return () => {};
    }
    
    const presenceRef = doc(db, "presence", uid);
    
    const unsubscribe = onSnapshot(presenceRef, 
      (snap) => {
        if (snap.exists()) {
          const data = snap.data();
          const roomName = data.currentRoomName || null;
          const roomId = data.currentRoomId || null;
          
          callback({
            roomName: roomName,
            roomId: roomId,
            isInRoom: !!roomName,
            lastUpdate: data.lastRoomUpdate || Date.now()
          });
        } else {
          callback({
            roomName: null,
            roomId: null,
            isInRoom: false,
            lastUpdate: null
          });
        }
      },
      (error) => {
        console.error('خطأ في مراقبة الغرفة:', error);
        callback({
          roomName: null,
          roomId: null,
          isInRoom: false,
          error: error.message
        });
      }
    );
    
    return unsubscribe;
  }

  // دالة لتحديث الغرفة عند الدخول/الخروج
  async function updateUserRoom(userId, roomName = null, roomId = null) {
    try {
      const presenceRef = doc(db, "presence", userId);
      await setDoc(presenceRef, {
        currentRoomName: roomName,
        currentRoomId: roomId,
        lastRoomUpdate: Date.now(),
        status: roomName ? 'in-room' : 'online',
        lastSeen: Date.now()
      }, { merge: true });
      
      console.log(`✅ تم تحديث الغرفة لـ ${userId}: ${roomName || 'بدون غرفة'}`);
      return true;
    } catch (e) {
      console.error('فشل تحديث الغرفة:', e);
      return false;
    }
  }

  // مراقبة عامة لجميع تغييرات presence
  function watchAllPresenceChanges() {
    const presenceRef = collection(db, "presence");
    
    return onSnapshot(presenceRef, (snapshot) => {
      let hasChanges = false;
      
      snapshot.docChanges().forEach((change) => {
        if (change.type === "modified" || change.type === "added") {
          const data = change.doc.data();
          const userId = change.doc.id;
          
          const user = allUsers.find(u => u.id === userId);
          if (user) {
            const oldRoom = user.currentRoomName;
            const newRoom = data.currentRoomName;
            
            if (oldRoom !== newRoom) {
              user.currentRoomName = newRoom;
              user.currentRoomId = data.currentRoomId;
              hasChanges = true;
              
              console.log(`🔄 ${user.username}: ${oldRoom || 'لا شيء'} → ${newRoom || 'لا شيء'}`);
            }
          }
        }
      });
      
      if (hasChanges) {
        renderMembersList();
      }
    });
  }

  async function loadInitialData() {
    if (!currentUser) return;
    try {
      const userDoc = await getDoc(doc(db, "users", currentUser.uid));
      if (userDoc.exists()) currentUserData = userDoc.data();
      
      const fDoc = await getDoc(doc(db, "social", "followers"));
      if (fDoc.exists()) followers = fDoc.data();
      
      const usersSnap = await getDocs(collection(db, "users"));
      allUsers = [];
      
      for (const d of usersSnap.docs) {
        const data = d.data();
        const userId = data.userId || d.id.substring(0, 6);
        
        // إذا لم يكن لديه countryCode نحاول استخراجه من الموقع الجغرافي
        if (!data.countryCode && data.location) {
          try {
            const countryCode = await getCountryFromCoords(
              data.location.latitude, 
              data.location.longitude
            );
            if (countryCode && countryCode.length === 2) {
              data.countryCode = countryCode;
              await updateDoc(doc(db, "users", d.id), { 
                countryCode: countryCode 
              }).catch(e => console.log('تحديث قاعدة البيانات فشل:', e));
            }
          } catch (e) {
            console.log(`فشل تحديد موقع ${data.username}:`, e);
          }
        }
        
        allUsers.push({ id: d.id, userId: userId, ...data });
      }
      
      console.log(`✅ تم تحميل ${allUsers.length} عضو`);
      
      // بدء المراقبة العامة للتغييرات
      if (globalPresenceUnsubscribe) {
        globalPresenceUnsubscribe();
      }
      globalPresenceUnsubscribe = watchAllPresenceChanges();
      
      onSnapshot(collection(db, "presence"), (snap) => {
        activeUids = [];
        snap.forEach(doc => {
          const data = doc.data();
          if (data.status === 'online' || data.lastSeen > Date.now() - 120000) {
            activeUids.push(doc.id);
          }
        });
        renderMembersList();
      });
      
      onSnapshot(query(collection(db, "stories"), where("expiresAt", ">", Date.now())), (snap) => {
        stories = [];
        snap.forEach(d => stories.push({ id: d.id, ...d.data() }));
        renderStoriesRow();
      });
      
      renderMembersList();
      
      // تحديث الرموز المفقودة بعد 5 ثواني
      setTimeout(() => updateMissingCountryCodes(), 5000);
      
    } catch (e) {
      console.error('❌ خطأ:', e);
      showToast('خطأ في تحميل البيانات', false);
    }
  }

    } else if (selectedStoryType === 'youtube') {
      const youtubeUrl = document.getElementById('storyYoutubeUrl').value.trim();
      const videoId = extractYoutubeId(youtubeUrl);
      if (!videoId) {
        showToast('رابط اليوتيوب غير صالح', false);
        return;
      }
      storyData.mediaUrl = youtubeUrl;
      storyData.text = document.getElementById('storyText').value.trim();
    }
    
    try {
      const storyRef = doc(collection(db, "stories"));
      await setDoc(storyRef, storyData);
      
      showToast('تم نشر الستوري بنجاح! 🎉');
      closeModal('addStoryModal');
      
      document.getElementById('storyText').value = '';
      document.getElementById('storyImageUrl').value = '';
      document.getElementById('storyYoutubeUrl').value = '';
      document.getElementById('previewArea').style.display = 'none';
      document.getElementById('previewArea').innerHTML = '';
    } catch (error) {
      console.error('خطأ في نشر الستوري:', error);
      showToast('فشل نشر الستوري', false);
    }
  };

  // مراقبة التغييرات في حقول الإدخال للمعاينة
  document.addEventListener('DOMContentLoaded', () => {
    const imageInput = document.getElementById('storyImageUrl');
    const youtubeInput = document.getElementById('storyYoutubeUrl');
    
    if (imageInput) {
      imageInput.addEventListener('input', updatePreview);
    }
    if (youtubeInput) {
      youtubeInput.addEventListener('input', updatePreview);
    }
  });

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      await loadInitialData();
      updatePresence();
      setInterval(() => updatePresence(), 60000);
    } else {
      document.getElementById('membersContainer').innerHTML = '<p style="text-align:center;padding:30px;">يرجى تسجيل الدخول لعرض الأعضاء</p>';
    }
  });

  document.getElementById('memberSearchInput').addEventListener('input', (e) => {
    searchTerm = e.target.value;
    renderMembersList();
  });

  // تنظيف عند الخروج
  window.addEventListener('beforeunload', () => {
    if (globalPresenceUnsubscribe) {
      globalPresenceUnsubscribe();
    }
    if (currentUser) {
      setDoc(doc(db, "presence", currentUser.uid), { status: 'offline', lastSeen: Date.now() });
    }
  });

  // تعريض الدوال للنافذة العالمية
  window.viewStory = window.viewStory;
  window.openProfile = window.openProfile;
  window.followUser = window.followUser;
  window.openPrivateChat = window.openPrivateChat;
  window.toggleStoryLike = window.toggleStoryLike;
  window.showStoryCommentInput = window.showStoryCommentInput;
  window.deleteStoryComment = window.deleteStoryComment;
  window.deleteStory = window.deleteStory;
  window.updateUserRoom = updateUserRoom;
  window.openAddStoryModal = window.openAddStoryModal;
  window.selectStoryType = window.selectStoryType;
  window.publishStory = window.publishStory;
</script>
</body>
</html>
