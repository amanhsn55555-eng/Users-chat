      margin: 0 auto;
    }

    }

    .story-item {

    .story-avatar img, .story-avatar span {

      width: 100%;
      height: 100%;
      border-radius: 16px;
    }

    }

      position: sticky;
      top: 60px;
      background: white;
      z-index: 5;

      padding: 12px;

      border-radius: 12px;
      cursor: pointer;

      font-size: 14px;

      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.3s;
      background: #f3f4f6;
      color: #4b5563;

      background: linear-gradient(135deg, #bfdbfe, #93c5fd);

    /* مربع إضافة التعليق */
    .comment-input-wrapper {

      align-items: center;

      background: #f8f9fa;

      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      border: 2px solid #e5e7eb;

    .comment-input-wrapper:focus-within {

      height: 100%;
      object-fit: cover;
    }

    .comment-input-field {

      font-family: inherit;

    .comment-submit-btn {

      height: 44px;

      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;

      flex-shrink: 0;

      transform: scale(1.1);

      transform: scale(0.95);

      opacity: 0.5;
      cursor: not-allowed;
      transform: none;

    .comments-section {

    .comment-item {

    }

    .comment-item:hover {
      border-color: #d1d5db;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);

    @keyframes slideIn {
      from {

        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }

    .comment-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .comment-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid #fbbf24;

      align-items: center;
      justify-content: center;

    .comment-avatar img {
      width: 100%;

    }

    .comment-user-details {
      flex: 1;

    }

    .comment-username {
      font-weight: 700;
      font-size: 13px;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .comment-time {
      font-size: 10px;
      color: #9ca3af;
      margin-top: 2px;
    }

    .comment-delete-btn {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 14px;
      padding: 6px;
      border-radius: 50%;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .comment-delete-btn:hover {
      background: #fee2e2;
      transform: scale(1.1);
    }

    .comment-text {
      font-size: 13px;
      line-height: 1.6;
      color: #4b5563;
      padding-right: 8px;
      border-right: 3px solid #e5e7eb;
    }

    .no-comments {
      text-align: center;
      padding: 24px;
      color: #9ca3af;
    }

    .no-comments i {
      font-size: 32px;
      margin-bottom: 8px;
      display: block;
    }

  <div id="membersContainer" class="members-list">

  </div>
</div>

    <div id="profileDetails"></div>
    <div id="profilePostsContainer" style="max-height: 45vh; overflow-y:auto; padding:8px;"></div>
  </div>
</div>

<div id="toastMsg"></div>

  import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, query, where, getDocs, deleteDoc, onSnapshot, arrayUnion, arrayRemove, increment, GeoPoint } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCPBrZMo6IYCwCDYV3HEfNcUmLUITR6VRc",
    authDomain: "elahbes.firebaseapp.com",
    projectId: "elahbes",

    appId: "1:800207969145:web:aa19b725d1c92dd48fada8"

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;

  let globalPresenceUnsubscribe = null;

  // خريطة أكواد الدول حسب القارات والمناطق
  const countryCodeMap = {

    'SA': '🇸🇦', 'AE': '🇦🇪', 'QA': '🇶🇦', 'KW': '🇰🇼', 'BH': '🇧🇭', 'OM': '🇴🇲',
    'IQ': '🇮🇶', 'SY': '🇸🇾', 'JO': '🇯🇴', 'LB': '🇱🇧', 'PS': '🇵🇸', 'YE': '🇾🇪',

    // أوروبا
    'GB': '🇬🇧', 'FR': '🇫🇷', 'DE': '🇩🇪', 'IT': '🇮🇹', 'ES': '🇪🇸', 'PT': '🇵🇹',
    'NL': '🇳🇱', 'BE': '🇧🇪', 'SE': '🇸🇪', 'NO': '🇳🇴', 'DK': '🇩🇰', 'FI': '🇫🇮',

    // أمريكا الجنوبية
    'BR': '🇧🇷', 'AR': '🇦🇷', 'CO': '🇨🇴', 'CL': '🇨🇱',
    
    // آسيا
    'TR': '🇹🇷', 'IR': '🇮🇷', 'PK': '🇵🇰', 'IN': '🇮🇳', 'BD': '🇧🇩',
    'CN': '🇨🇳', 'JP': '🇯🇵', 'KR': '🇰🇷', 'ID': '🇮🇩', 'MY': '🇲🇾',
    
    // أفريقيا
    'NG': '🇳🇬', 'ZA': '🇿🇦', 'KE': '🇰🇪', 'ET': '🇪🇹',

  function getFlagEmoji(countryCode) {
    if (!countryCode || countryCode.length !== 2) return '';
    return countryCodeMap[countryCode.toUpperCase()] || 
           String.fromCodePoint(...countryCode.toUpperCase().split('').map(c => 0x1F1E6 + c.charCodeAt(0) - 65));
  }

  // دالة استخراج كود الدولة من الإحداثيات باستخدام Reverse Geocoding - نسخة محسنة
  async function getCountryFromCoords(lat, lng) {
    try {
      // محاولة أولى مع Nominatim
      const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=3&accept-language=en`, {
        headers: {
          'User-Agent': 'MyApp/1.0'
        }
      });
      
      if (response.ok) {
        const data = await response.json();
        const countryCode = data.address?.country_code?.toUpperCase();
        if (countryCode && countryCode.length === 2) {
          return countryCode;
        }
      }
      
      // محاولة ثانية مع API آخر
      const response2 = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lng}&localityLanguage=en`);
      const data2 = await response2.json();
      return data2.countryCode?.toUpperCase() || '';
      
    } catch (error) {
      console.error('Error getting country:', error);
      
      // محاولة احتياطية مع API آخر
      try {
        const response3 = await fetch(`https://geocode.xyz/${lat},${lng}?geoit=json`);
        const data3 = await response3.json();
        return data3.country?.toUpperCase() || '';
      } catch (e2) {
        console.error('Backup API failed:', e2);
        return '';
      }
    }
  }

  // دالة لتحديث أكواد الدول للمستخدمين الذين ليس لديهم
  async function updateMissingCountryCodes() {
    const usersWithoutCountry = allUsers.filter(u => !u.countryCode && u.location);
    
    for (const user of usersWithoutCountry) {
      try {
        const countryCode = await getCountryFromCoords(
          user.location.latitude, 
          user.location.longitude
        );
        
        if (countryCode) {
          user.countryCode = countryCode;
          await updateDoc(doc(db, "users", user.id), { 
            countryCode: countryCode 
          });
          console.log(`✅ تم تحديث كود الدولة لـ ${user.username}: ${countryCode}`);
        }
      } catch (e) {
        console.error(`فشل تحديث ${user.username}:`, e);
      }
    }
    
    if (usersWithoutCountry.length > 0) {
      renderMembersList();
    }
  }

  // دالة لمراقبة تغييرات الغرفة فورياً
  function watchUserRoomRealtime(uid, callback) {
    if (!uid) {
      callback({ roomName: null, roomId: null, isInRoom: false });
      return () => {};
    }
    
    const presenceRef = doc(db, "presence", uid);
    
    const unsubscribe = onSnapshot(presenceRef, 
      (snap) => {
        if (snap.exists()) {
          const data = snap.data();
          const roomName = data.currentRoomName || null;
          const roomId = data.currentRoomId || null;
          
          callback({
            roomName: roomName,
            roomId: roomId,
            isInRoom: !!roomName,
            lastUpdate: data.lastRoomUpdate || Date.now()
          });
        } else {
          callback({
            roomName: null,
            roomId: null,
            isInRoom: false,
            lastUpdate: null
          });
        }
      },
      (error) => {
        console.error('خطأ في مراقبة الغرفة:', error);
        callback({
          roomName: null,
          roomId: null,
          isInRoom: false,
          error: error.message
        });
      }
    );
    
    return unsubscribe;
  }

  // دالة لتحديث الغرفة عند الدخول/الخروج
  async function updateUserRoom(userId, roomName = null, roomId = null) {
    try {
      const presenceRef = doc(db, "presence", userId);
      await setDoc(presenceRef, {
        currentRoomName: roomName,
        currentRoomId: roomId,
        lastRoomUpdate: Date.now(),
        status: roomName ? 'in-room' : 'online',
        lastSeen: Date.now()
      }, { merge: true });
      
      console.log(`✅ تم تحديث الغرفة لـ ${userId}: ${roomName || 'بدون غرفة'}`);
      return true;
    } catch (e) {
      console.error('فشل تحديث الغرفة:', e);
      return false;
    }
  }

  // مراقبة عامة لجميع تغييرات presence
  function watchAllPresenceChanges() {
    const presenceRef = collection(db, "presence");
    
    return onSnapshot(presenceRef, (snapshot) => {
      let hasChanges = false;
      
      snapshot.docChanges().forEach((change) => {
        if (change.type === "modified" || change.type === "added") {
          const data = change.doc.data();
          const userId = change.doc.id;
          
          const user = allUsers.find(u => u.id === userId);
          if (user) {
            const oldRoom = user.currentRoomName;
            const newRoom = data.currentRoomName;
            
            if (oldRoom !== newRoom) {
              user.currentRoomName = newRoom;
              user.currentRoomId = data.currentRoomId;
              hasChanges = true;
              
              console.log(`🔄 ${user.username}: ${oldRoom || 'لا شيء'} → ${newRoom || 'لا شيء'}`);
            }
          }
        }
      });
      
      if (hasChanges) {
        renderMembersList();
      }
    });
  }

  async function loadInitialData() {
    if (!currentUser) return;
    try {
      const userDoc = await getDoc(doc(db, "users", currentUser.uid));
      if (userDoc.exists()) currentUserData = userDoc.data();
      
      const fDoc = await getDoc(doc(db, "social", "followers"));
      if (fDoc.exists()) followers = fDoc.data();
      
      const usersSnap = await getDocs(collection(db, "users"));
      allUsers = [];
      
      for (const d of usersSnap.docs) {
        const data = d.data();
        const userId = data.userId || d.id.substring(0, 6);
        
        // إذا لم يكن لديه countryCode نحاول استخراجه من الموقع الجغرافي
        if (!data.countryCode && data.location) {
          try {
            const countryCode = await getCountryFromCoords(
              data.location.latitude, 
              data.location.longitude
            );
            if (countryCode && countryCode.length === 2) {
              data.countryCode = countryCode;
              await updateDoc(doc(db, "users", d.id), { 
                countryCode: countryCode 
              }).catch(e => console.log('تحديث قاعدة البيانات فشل:', e));
            }
          } catch (e) {
            console.log(`فشل تحديد موقع ${data.username}:`, e);
          }
        }
        
        allUsers.push({ id: d.id, userId: userId, ...data });
      }
      
      console.log(`✅ تم تحميل ${allUsers.length} عضو`);
      
      // بدء المراقبة العامة للتغييرات
      if (globalPresenceUnsubscribe) {
        globalPresenceUnsubscribe();
      }
      globalPresenceUnsubscribe = watchAllPresenceChanges();
      
      onSnapshot(collection(db, "presence"), (snap) => {
        activeUids = [];
        snap.forEach(doc => {
          const data = doc.data();
          if (data.status === 'online' || data.lastSeen > Date.now() - 120000) {
            activeUids.push(doc.id);
          }
        });
        renderMembersList();
      });
      
      onSnapshot(query(collection(db, "stories"), where("expiresAt", ">", Date.now())), (snap) => {
        stories = [];
        snap.forEach(d => stories.push({ id: d.id, ...d.data() }));
        renderStoriesRow();
      });
      
      renderMembersList();
      
      // تحديث الرموز المفقودة بعد 5 ثواني
      setTimeout(() => updateMissingCountryCodes(), 5000);
      
    } catch (e) {
      console.error('❌ خطأ:', e);
      showToast('خطأ في تحميل البيانات', false);
    }
  }

        (u.userId || '').includes(searchTerm) ||
        (u.displayName || '').includes(searchTerm)
      );
    }
    
    return members;
  }

          autocomplete="off"
        >
        <button class="comment-submit-btn" id="submitBtn_${story.id}" onclick="window.submitStoryComment('${story.id}')" title="إرسال">
          <i class="fas fa-paper-plane"></i>
        </button>
      </div>
      
      <!-- قائمة التعليقات -->
      <div class="comments-section" id="storyComments_${story.id}">
        <div class="comments-title">
          <i class="fas fa-comments"></i>
          التعليقات
          <span class="comments-count">${commentsCount}</span>
        </div>
        ${renderComments(story.comments || [], story.id)}
      </div>
    `;
    
    openModal('storyModal');
    
    // تركيز على حقل الإدخال
    setTimeout(() => {
      const inputField = document.getElementById(`commentInput_${story.id}`);
      if (inputField) inputField.focus();
    }, 500);
  };

  // دالة إرسال التعليق - مصلحة
  window.submitStoryComment = async function(sid) {
    console.log('🟢 بدء محاولة إرسال التعليق للقصة:', sid);
    
    if (!currentUser) {
      showToast('يرجى تسجيل الدخول أولاً', false);
      return;
    }
    
    if (!currentUserData) {
      showToast('جاري تحميل بيانات المستخدم...', false);
      return;
    }
    
    const inputField = document.getElementById(`commentInput_${sid}`);
    if (!inputField) {
      console.error('❌ حقل الإدخال غير موجود');
      return;
    }
    
    const text = inputField.value.trim();
    if (!text) {
      showToast('الرجاء كتابة تعليق', false);
      return;
    }
    
    const submitBtn = document.getElementById(`submitBtn_${sid}`);
    if (submitBtn) {
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
    }
    
    const comment = {
      id: 'c' + Date.now(),
      username: currentUserData?.username || 'مستخدم',
      userId: currentUserData?.userId || currentUser.uid,
      emoji: currentUserData?.emoji || '👤',
      avatarUrl: currentUserData?.avatarUrl || null,
      text: text,
      timestamp: Date.now()
    };
    
    console.log('📝 محتوى التعليق:', comment);
    
    try {
      const storyRef = doc(db, "stories", sid);
      await updateDoc(storyRef, { 
        comments: arrayUnion(comment) 
      });
      
      console.log('✅ تم إرسال التعليق بنجاح');
      
      // تحديث محلي للقصة
      const story = stories.find(s => s.id === sid);
      if (story) {
        story.comments = [...(story.comments || []), comment];
        const commentsDiv = document.getElementById(`storyComments_${sid}`);
        if (commentsDiv) {
          commentsDiv.innerHTML = `
            <div class="comments-title">
              <i class="fas fa-comments"></i>
              التعليقات
              <span class="comments-count">${story.comments.length}</span>
            </div>
            ${renderComments(story.comments, sid)}
          `;
        }
      }
      
      // مسح حقل الإدخال
      inputField.value = '';
      showToast('تم إضافة التعليق ✓');
      
      // إعادة تركيز على حقل الإدخال للتعليق التالي
      setTimeout(() => inputField.focus(), 300);
      
    } catch (error) {
      console.error('❌ خطأ في إضافة التعليق:', error);
      showToast('فشل في إضافة التعليق: ' + error.message, false);
    } finally {
      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i>';
      }
    }
  };

  window.toggleStoryLike = async (sid) => {
    if (!currentUser) {
      showToast('يرجى تسجيل الدخول أولاً', false);
      return;
    }
    const ref = doc(db, "stories", sid);
    const story = stories.find(s => s.id === sid);
    if (!story) return;
    
    const liked = (story.likedBy || []).includes(currentUser.uid);
    
    try {
      await updateDoc(ref, { 
        likedBy: liked ? arrayRemove(currentUser.uid) : arrayUnion(currentUser.uid), 
        likes: increment(liked ? -1 : 1) 
      });
      
      // تحديث محلي
      story.likedBy = liked ? 
        story.likedBy.filter(uid => uid !== currentUser.uid) : 
        [...(story.likedBy || []), currentUser.uid];
      story.likes = (story.likes || 0) + (liked ? -1 : 1);
      
      const likesSpan = document.getElementById(`storyLikes_${sid}`);
      if (likesSpan) {
        likesSpan.textContent = story.likes;
        likesSpan.style.transform = 'scale(1.2)';
        setTimeout(() => likesSpan.style.transform = 'scale(1)', 200);
      }
      
    } catch (error) {
      console.error('خطأ في تحديث الإعجاب:', error);
      showToast('فشل في تحديث الإعجاب', false);
    }
  };

  window.deleteStoryComment = async (sid, cid) => {
    if (!confirm('هل أنت متأكد من حذف هذا التعليق؟')) return;
    
    const story = stories.find(s => s.id === sid);
    const comment = story?.comments?.find(c => c.id === cid);
    
    if (comment) {
      try {
        await updateDoc(doc(db, "stories", sid), { 
          comments: arrayRemove(comment) 
        });
        
        // تحديث محلي
        story.comments = story.comments.filter(c => c.id !== cid);
        
        const commentsDiv = document.getElementById(`storyComments_${sid}`);
        if (commentsDiv) {
          commentsDiv.innerHTML = `
            <div class="comments-title">
              <i class="fas fa-comments"></i>
              التعليقات
              <span class="comments-count">${story.comments.length}</span>
            </div>
            ${renderComments(story.comments, sid)}
          `;
        }
        
        showToast('تم حذف التعليق ✓');
      } catch (error) {
        console.error('خطأ في حذف التعليق:', error);
        showToast('فشل في حذف التعليق', false);
      }
    }
  };

  window.deleteStory = async (sid) => { 
    if (confirm('هل أنت متأكد من حذف هذه القصة؟')) {
      try {
        await deleteDoc(doc(db, "stories", sid)); 
        closeModal('storyModal');
        showToast('تم حذف القصة بنجاح');
      } catch (error) {
        console.error('خطأ في حذف القصة:', error);
        showToast('فشل في حذف القصة', false);
      }
    }
  };

  // الملف الشخصي
  window.openProfile = async (userId) => {
    const user = allUsers.find(u => u.userId === userId) || { userId, username: 'مستخدم '+userId, emoji:'👤', colors:{frame:'#fbbf24'} };
    const followersCount = Object.values(followers).filter(arr => arr?.includes(userId)).length;
    const followingCount = followers[userId]?.length || 0;
    const followed = isFollowing(userId);
    const hasCustomFrame = hasFrame(user);
    const flag = user.countryCode ? getFlagEmoji(user.countryCode) : '';
    
    const nameDisplay = user.nameImage ? 
      `<img src="${user.nameImage}" class="name-image" alt="${user.username}">` : 
      (user.username || user.displayName);
    
    document.getElementById('profileModalUsername').innerText = user.username || user.displayName;
    const details = document.getElementById('profileDetails');
    details.innerHTML = `
      <div style="display:flex; gap:12px; align-items:center;">
        <div class="member-avatar ${hasCustomFrame ? 'has-frame' : ''}" style="width:60px;height:60px;border-color:${user.colors?.frame || '#fbbf24'};">
          ${renderAvatar(user)}
        </div>
        <div>
          <h2>${flag} ${nameDisplay} ${user.verified?'<i class="fas fa-check-circle" style="color:#3b82f6;"></i>':''}</h2>
          <span class="user-id-badge">#${user.userId}</span>
        </div>
      </div>
      <div style="display:flex; gap:20px; margin:15px 0;">
        <div><i class="fas fa-users"></i> متابعين ${followersCount}</div>
        <div><i class="fas fa-user-plus"></i> يتابع ${followingCount}</div>
      </div>
      <p>${user.bio || 'لا يوجد نبذة'}</p>
      <div style="display:flex; gap:10px; margin:15px 0;">
        ${userId !== currentUserData?.userId ? `
          <button onclick="window.followUser('${userId}')" style="flex:1; background:${followed?'#10b981':'#4f46e5'}; color:white; border:none; padding:12px; border-radius:8px;">${followed?'متابَع':'متابعة'}</button>
          <button onclick="window.openPrivateChat('${userId}')" style="flex:1; background:#0ea5e9; color:white; border:none; padding:12px; border-radius:8px;">مراسلة</button>
        ` : `<button onclick="alert('سيتم فتح صفحة الإعدادات قريباً')" style="width:100%; background:#333; color:white; border:none; padding:12px; border-radius:8px;">الضبط</button>`}
      </div>
    `;
    document.getElementById('profilePostsContainer').innerHTML = '<p style="color:#888; text-align:center;">المنشورات تظهر هنا</p>';
    openModal('profileModal');
  };

  window.followUser = async (userId) => {
    if (!currentUser) return;
    if (!followers[currentUser.uid]) followers[currentUser.uid] = [];
    const idx = followers[currentUser.uid].indexOf(userId);
    if (idx === -1) followers[currentUser.uid].push(userId);
    else followers[currentUser.uid].splice(idx, 1);
    await setDoc(doc(db, "social", "followers"), { [currentUser.uid]: followers[currentUser.uid] }, { merge: true });
    renderMembersList();
    if (document.getElementById('profileModal').classList.contains('active')) window.openProfile(userId);
  };

  window.openPrivateChat = (userId) => {
    localStorage.setItem('openChatWith', userId);
    window.open('https://amanhsn55555-eng.github.io/Msgtdy/', '_blank');
  };

  // دالة تحديث جميع الغرف
  window.refreshAllRooms = () => {
    renderMembersList();
    showToast('تم تحديث جميع الغرف');
  };

  async function updatePresence() {
    if (!currentUser) return;
    const presenceRef = doc(db, "presence", currentUser.uid);
    await setDoc(presenceRef, { status: 'online', lastSeen: Date.now() });
  }

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      await loadInitialData();
      updatePresence();
      setInterval(() => updatePresence(), 60000);
    } else {
      document.getElementById('membersContainer').innerHTML = '<p style="text-align:center;padding:30px;">يرجى تسجيل الدخول لعرض الأعضاء</p>';
    }
  });

  document.getElementById('memberSearchInput').addEventListener('input', (e) => {
    searchTerm = e.target.value;
    renderMembersList();
  });

  // تنظيف عند الخروج
  window.addEventListener('beforeunload', () => {
    if (globalPresenceUnsubscribe) {
      globalPresenceUnsubscribe();
    }
    if (currentUser) {
      setDoc(doc(db, "presence", currentUser.uid), { status: 'offline', lastSeen: Date.now() });
    }
  });

  // تعريض الدوال للنافذة العالمية
  window.viewStory = window.viewStory;
  window.openProfile = window.openProfile;
  window.followUser = window.followUser;
  window.openPrivateChat = window.openPrivateChat;
  window.toggleStoryLike = window.toggleStoryLike;
  window.submitStoryComment = window.submitStoryComment;
  window.deleteStoryComment = window.deleteStoryComment;
  window.deleteStory = window.deleteStory;
  window.updateUserRoom = updateUserRoom;
</script>
</body>
</html>
